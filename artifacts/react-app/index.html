<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Eden Communications</title>
    <meta name="description" content="The private platform for Lifestyle of Eden coaches and clients." />
    <meta name="robots" content="index, follow" />

    <!-- PWA / home screen -->
    <link rel="manifest" href="/manifest.json" />
    <script>
      // Branded installs: visits to a DBA/sub-brand link (/<slug>) swap the
      // manifest to the API's per-slug manifest BEFORE Chrome evaluates
      // installability, so "Add to Home Screen" saves that space's link and
      // branding. Unknown slugs fall back server-side to the Eden default,
      // so this can never break installability. Runs at parse time — before
      // any framework code or beforeinstallprompt.
      (function () {
        var base = '%BASE_URL%'.replace(/\/+$/, ''); // Vite base, '' at root
        var path = location.pathname;
        if (base && path.indexOf(base + '/') === 0) path = path.slice(base.length);
        var seg = (path.split('/')[1] || '').toLowerCase();
        var reserved = { '': 1, video: 1, api: 1, __mockup: 1, 'index.html': 1 };
        if (!reserved[seg] && /^[a-z0-9-]{2,40}$/.test(seg)) {
          window.__edenManifestSlug = seg;
          // API mounts at the site root (/api) regardless of the app base;
          // the app base only shapes start_url/scope/icons inside the manifest.
          var link = document.querySelector('link[rel="manifest"]');
          if (link) link.href = '/api/dba/manifest?slug=' + encodeURIComponent(seg) + '&base=' + encodeURIComponent(base || '/');
          // iOS ignores manifest icons — swap the apple-touch-icon too so the
          // home-screen icon uses the sub-brand's logo. The tag appears later
          // in <head>, so create a branded one here (first match wins on iOS).
          var touch = document.createElement('link');
          touch.rel = 'apple-touch-icon';
          touch.href = '/api/dba/icon?slug=' + encodeURIComponent(seg);
          document.head.appendChild(touch);
        }
      })();
    </script>
    <meta name="theme-color" content="#ffa600" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Eden Comms" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="Eden Communications" />
    <meta property="og:description" content="The private platform for Lifestyle of Eden coaches and clients." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Eden Communications" />
    <meta name="twitter:description" content="The private platform for Lifestyle of Eden coaches and clients." />
    <meta name="twitter:image" content="/icon-512.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
